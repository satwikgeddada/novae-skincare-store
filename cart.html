<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | NOVAÉ</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <aside class="announcement-bar" role="note">
        <p>Free shipping on orders above ₹999</p>
    </aside>

    <header class="site-header">
        <div class="container nav-container">
            <button type="button" class="mobile-menu-btn"
                    aria-label="Open navigation menu"
                    aria-expanded="false"
                    aria-controls="primary-nav">
                <i class="ph ph-list" aria-hidden="true"></i>
            </button>
            <nav class="nav-left" id="primary-nav" aria-label="Primary navigation">
                <ul class="nav-links" role="list">
                    <li><a href="shop.html">Shop</a></li>
                    <li><a href="index.html#bestsellers">Best Sellers</a></li>
                    <li><a href="index.html#about">About</a></li>
                </ul>
            </nav>
            <a href="index.html" class="logo" aria-label="NOVAÉ — Home">NOVAÉ</a>
            <div class="nav-right">
                <button type="button" aria-label="Search" onclick="window.location.href='shop.html'">
                    <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
                </button>
                <button type="button" aria-label="View wishlist">
                    <i class="ph ph-heart" aria-hidden="true"></i>
                </button>
                <a href="cart.html" class="cart-btn" aria-label="View cart">
                    <i class="ph ph-shopping-bag" aria-hidden="true"></i>
                    <span class="cart-count" aria-live="polite" aria-label="Cart items">0</span>
                </a>
            </div>
        </div>
    </header>

    <main class="cart-page container section" id="main-content" style="min-height: 60vh;">
        <h1 class="text-center" style="margin-bottom: 4rem;">Your Cart</h1>
        <div id="cart-container">
            <!-- Injected via JS -->
        </div>
    </main>

    <footer class="site-footer bg-charcoal">
        <div class="container footer-grid">
            <div class="footer-brand">
                <a href="index.html" class="footer-logo">NOVAÉ</a>
                <p>Clean care. Real glow.</p>
            </div>
            <div class="footer-links">
                <h4>Shop</h4>
                <ul><li><a href="shop.html">All Products</a></li></ul>
            </div>
        </div>
        <div class="container footer-bottom">
            <p>&copy; 2026 NOVAÉ. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
